<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#09030b">
<meta name="description" content="A little birthday universe made with love for Aishu ❤️">

<title>For My Aishu ❤️</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:wght@300;400;500;600&display=swap');


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#09030b;
    color:white;
    font-family:Poppins,sans-serif;
    overflow-x:hidden;
}


/* =========================================================
   ANIMATED BACKGROUND
========================================================= */

.background{
    position:fixed;
    inset:0;
    z-index:-20;
    overflow:hidden;
    background:
        radial-gradient(circle at 15% 15%,rgba(255,70,130,.20),transparent 30%),
        radial-gradient(circle at 85% 20%,rgba(140,70,255,.20),transparent 30%),
        radial-gradient(circle at 50% 90%,rgba(255,40,100,.15),transparent 35%),
        #09030b;
    animation:
        backgroundMove 14s ease-in-out infinite alternate;
}

@keyframes backgroundMove{
    0%{
        transform:scale(1);
        filter:hue-rotate(0deg);
    }

    100%{
        transform:scale(1.08);
        filter:hue-rotate(12deg);
    }
}


/* glowing blobs */

.blob{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    pointer-events:none;
    z-index:-15;
    opacity:.25;
}

.blob.one{
    width:240px;
    height:240px;
    background:#ff4f91;
    top:10%;
    left:-100px;
    animation:blobOne 12s ease-in-out infinite alternate;
}

.blob.two{
    width:300px;
    height:300px;
    background:#8b5cf6;
    right:-140px;
    top:40%;
    animation:blobTwo 15s ease-in-out infinite alternate;
}

.blob.three{
    width:220px;
    height:220px;
    background:#ff2f78;
    bottom:-100px;
    left:35%;
    animation:blobThree 11s ease-in-out infinite alternate;
}

@keyframes blobOne{
    to{
        transform:translate(120px,100px) scale(1.3);
    }
}

@keyframes blobTwo{
    to{
        transform:translate(-100px,-80px) scale(1.2);
    }
}

@keyframes blobThree{
    to{
        transform:translate(80px,-120px) scale(1.3);
    }
}


/* =========================================================
   STARS
========================================================= */

.stars{
    position:fixed;
    inset:0;
    z-index:-10;
    opacity:.65;
    pointer-events:none;

    background-image:
        radial-gradient(2px 2px at 10% 20%,#fff,transparent),
        radial-gradient(1px 1px at 30% 70%,#fff,transparent),
        radial-gradient(2px 2px at 70% 15%,#fff,transparent),
        radial-gradient(1px 1px at 90% 60%,#fff,transparent),
        radial-gradient(1px 1px at 55% 40%,#fff,transparent),
        radial-gradient(1px 1px at 20% 90%,#fff,transparent);

    background-size:240px 240px;

    animation:starsMove 22s linear infinite;
}

@keyframes starsMove{
    to{
        background-position:240px 0;
    }
}


/* =========================================================
   TOP PROGRESS
========================================================= */

.progress{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:3px;
    background:rgba(255,255,255,.05);
    z-index:999;
}

.progress-bar{
    width:0%;
    height:100%;
    background:linear-gradient(
        90deg,
        #ff6a9d,
        #ffb3d1,
        #c7a4ff,
        #ff6a9d
    );
    box-shadow:
        0 0 10px #ff6a9d,
        0 0 20px rgba(255,100,160,.5);

    transition:width .15s linear;
}


/* =========================================================
   INTRO SCREEN
========================================================= */

#intro{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    background:
        radial-gradient(circle at center,rgba(255,70,130,.12),transparent 45%),
        #09030b;

    transition:
        opacity 1.3s ease,
        visibility 1.3s ease;
}

#intro.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.intro-inner{
    width:min(90%,560px);
    padding:30px;

    animation:introAppear 1.5s cubic-bezier(.2,.8,.2,1);
}

@keyframes introAppear{
    from{
        opacity:0;
        transform:scale(.75) translateY(40px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.intro-heart{
    font-size:64px;
    display:inline-block;
    animation:
        introHeart 1.3s ease-in-out infinite,
        introFloat 3s ease-in-out infinite;
}

@keyframes introHeart{
    50%{
        transform:scale(1.25);
    }
}

@keyframes introFloat{
    50%{
        margin-top:-10px;
    }
}

.intro-inner h1{
    font-family:"DM Serif Display",serif;
    font-size:clamp(45px,11vw,70px);
    font-weight:400;
    font-style:italic;
    line-height:1;
    margin:25px 0 15px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ff9fc0,
            #d8b4ff,
            #fff
        );

    background-size:300% auto;

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    animation:introGradient 5s linear infinite;
}

@keyframes introGradient{
    to{
        background-position:300% center;
    }
}

.intro-inner p{
    opacity:.7;
    line-height:1.9;
    font-size:14px;
    margin-bottom:30px;
}

.open-button{
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.07);
    color:#fff;

    border-radius:999px;

    padding:16px 30px;

    font-family:Poppins,sans-serif;
    font-size:14px;
    font-weight:500;

    cursor:pointer;

    backdrop-filter:blur(12px);

    box-shadow:
        0 0 25px rgba(255,80,150,.15);

    transition:.4s;
}

.open-button:hover{
    transform:
        translateY(-4px)
        scale(1.04);

    background:rgba(255,255,255,.13);

    box-shadow:
        0 12px 45px rgba(255,80,150,.3);
}


/* =========================================================
   MAIN
========================================================= */

main{
    width:min(900px,100%);
    margin:auto;
}

section{
    min-height:100vh;

    padding:
        90px 18px;

    display:flex;
    align-items:center;
    justify-content:center;
}


/* =========================================================
   GLASS CARD
========================================================= */

.card{
    width:100%;

    padding:
        45px 24px;

    border-radius:32px;

    border:
        1px solid rgba(255,255,255,.12);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );

    backdrop-filter:blur(18px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.45);

    position:relative;

    overflow:hidden;

    text-align:center;
}

.card::before{
    content:"";

    position:absolute;

    width:220px;
    height:220px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,100,160,.16),
            transparent 70%
        );

    top:-120px;
    right:-100px;

    pointer-events:none;
}

.card::after{
    content:"";

    position:absolute;

    width:160px;
    height:160px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(170,110,255,.10),
            transparent 70%
        );

    bottom:-90px;
    left:-80px;

    pointer-events:none;
}


/* =========================================================
   TYPOGRAPHY
========================================================= */

.kicker{
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;
    opacity:.55;
}

h1,
h2,
h3{
    font-family:"DM Serif Display",serif;
    font-weight:400;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:100vh;
}

.hero h1{
    font-size:
        clamp(
            55px,
            14vw,
            105px
        );

    line-height:.88;

    margin:
        20px 0;
}

.hero h1 span{
    display:block;

    font-style:italic;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ff9cbd,
            #d4adff,
            #fff
        );

    background-size:300% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        heroGradient 5s linear infinite,
        heroGlow 3s ease-in-out infinite alternate;
}

@keyframes heroGradient{
    to{
        background-position:300% center;
    }
}

@keyframes heroGlow{
    from{
        filter:
            drop-shadow(
                0 0 3px
                rgba(255,120,170,.2)
            );
    }

    to{
        filter:
            drop-shadow(
                0 0 18px
                rgba(255,120,170,.5)
            );
    }
}

.hero-text{
    max-width:620px;
    margin:25px auto;

    line-height:1.9;

    opacity:.75;

    font-size:15px;
}

.scroll-hint{
    margin-top:40px;

    font-size:11px;

    opacity:.45;

    animation:
        scrollHint 2s ease-in-out infinite;
}

@keyframes scrollHint{
    50%{
        transform:translateY(8px);
        opacity:.75;
    }
}


/* =========================================================
   FEATURED PHOTO
========================================================= */

.featured-section{
    min-height:auto;
    padding-top:40px;
}

.featured-title{
    font-family:"DM Serif Display",serif;

    font-size:
        clamp(
            38px,
            10vw,
            60px
        );

    margin:
        12px 0 8px;
}

.featured-subtitle{
    opacity:.58;
    font-size:13px;
    line-height:1.8;

    max-width:500px;
    margin:0 auto 30px;
}


/* featured photo frame */

.featured-frame{
    position:relative;

    width:100%;

    border-radius:28px;

    padding:6px;

    background:
        linear-gradient(
            135deg,
            rgba(255,120,170,.75),
            rgba(180,110,255,.65),
            rgba(255,180,210,.55),
            rgba(255,100,160,.75)
        );

    background-size:300% 300%;

    animation:
        frameGradient 8s ease infinite;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        0 0 50px rgba(255,80,150,.16);

    transform:
        perspective(1000px)
        rotateX(2deg);

    transition:
        transform .7s ease;
}

@keyframes frameGradient{
    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

.featured-frame:hover{
    transform:
        perspective(1000px)
        rotateX(0deg)
        scale(1.015);
}

.featured-photo{
    position:relative;

    overflow:hidden;

    border-radius:23px;

    background:#09030b;

    aspect-ratio:
        4 / 5;
}

.featured-photo img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transform:
        scale(1.02);

    transition:
        transform 1.5s
        cubic-bezier(.2,.8,.2,1);
}

.featured-frame:hover
.featured-photo img{
    transform:scale(1.09);
}


/* moving shine */

.featured-photo::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            120deg,
            transparent 25%,
            rgba(255,255,255,.22),
            transparent 65%
        );

    transform:
        translateX(-130%);

    animation:
        featuredShine 5s
        ease-in-out
        infinite;

    pointer-events:none;
}

@keyframes featuredShine{
    0%,
    55%{
        transform:translateX(-130%);
    }

    75%,
    100%{
        transform:translateX(130%);
    }
}


/* featured caption */

.featured-caption{
    margin-top:22px;

    font-family:
        "DM Serif Display",
        serif;

    font-size:27px;

    font-style:italic;

    color:#ffb1ca;

    animation:
        captionGlow
        3s ease-in-out
        infinite alternate;
}

@keyframes captionGlow{
    from{
        text-shadow:
            0 0 4px
            rgba(255,120,170,.1);
    }

    to{
        text-shadow:
            0 0 18px
            rgba(255,120,170,.55);
    }
}

.featured-small{
    margin-top:7px;

    opacity:.48;

    font-size:11px;

    letter-spacing:1px;
}


/* =========================================================
   MEMORY GALLERY
========================================================= */

.gallery-section{
    padding-top:60px;
}

.gallery-title{
    font-family:
        "DM Serif Display",
        serif;

    font-size:
        clamp(
            42px,
            10vw,
            62px
        );

    margin:
        12px 0;
}

.gallery-description{
    max-width:550px;

    margin:
        0 auto 35px;

    opacity:.58;

    font-size:13px;

    line-height:1.9;
}


/* gallery grid */

.photo-grid{
    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:12px;
}


/* photo card */

.photo{
    position:relative;

    height:
        clamp(
            170px,
            44vw,
            280px
        );

    overflow:hidden;

    border-radius:20px;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            rgba(255,100,150,.16),
            rgba(160,100,255,.15)
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    opacity:0;

    transform:
        translateY(70px)
        scale(.92);

    transition:
        opacity 1s ease,
        transform 1s
        cubic-bezier(.2,.8,.2,1),
        box-shadow .4s ease;
}


/* alternating entrance */

.photo:nth-child(odd){
    transform:
        translateX(-80px)
        rotate(-3deg)
        scale(.92);
}

.photo:nth-child(even){
    transform:
        translateX(80px)
        rotate(3deg)
        scale(.92);
}

.photo.visible{
    opacity:1;

    transform:
        translateX(0)
        translateY(0)
        rotate(0)
        scale(1);
}

.photo:hover{
    transform:
        translateY(-8px)
        scale(1.035);

    box-shadow:
        0 20px 45px
        rgba(255,80,150,.25);
}

.photo img{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transition:
        transform .9s
        cubic-bezier(.2,.8,.2,1);
}

.photo:hover img{
    transform:scale(1.10);
}


/* shine on photos */

.photo::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            125deg,
            transparent 35%,
            rgba(255,255,255,.12),
            transparent 65%
        );

    transform:
        translateX(-130%);

    transition:
        transform .8s;

    pointer-events:none;
}

.photo:hover::after{
    transform:
        translateX(130%);
}


/* =========================================================
   LIGHTBOX
========================================================= */

#lightbox{
    position:fixed;

    inset:0;

    z-index:800;

    display:none;

    align-items:center;
    justify-content:center;

    padding:15px;

    background:
        rgba(4,1,7,.96);

    opacity:0;
}

#lightbox.show{
    display:flex;

    animation:
        lightboxAppear
        .35s ease forwards;
}

@keyframes lightboxAppear{
    to{
        opacity:1;
    }
}

.lightbox-image{
    max-width:96%;
    max-height:88vh;

    object-fit:contain;

    border-radius:18px;

    box-shadow:
        0 25px 90px
        rgba(0,0,0,.75);

    animation:
        imageZoom
        .5s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes imageZoom{
    from{
        opacity:0;
        transform:scale(.78);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.close-lightbox{
    position:absolute;

    top:18px;
    right:18px;

    width:46px;
    height:46px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.25);

    background:
        rgba(255,255,255,.08);

    color:white;

    font-size:25px;

    cursor:pointer;

    backdrop-filter:blur(10px);
}


/* =========================================================
   LOVE LETTER
========================================================= */

.letter-section{
    min-height:90vh;
}

.letter-title{
    font-family:
        "DM Serif Display",
        serif;

    font-size:
        clamp(
            45px,
            11vw,
            65px
        );

    margin:
        12px 0 30px;
}

.letter{
    text-align:left;

    max-width:650px;

    margin:auto;
}

.letter p{
    font-size:15px;

    line-height:2;

    color:
        rgba(255,255,255,.82);

    margin:
        0 0 22px;

    opacity:0;

    transform:
        translateY(20px);

    transition:
        opacity .8s ease,
        transform .8s ease;
}

.letter.visible p{
    opacity:1;

    transform:none;
}

.letter.visible p:nth-child(2){
    transition-delay:.15s;
}

.letter.visible p:nth-child(3){
    transition-delay:.30s;
}

.letter.visible p:nth-child(4){
    transition-delay:.45s;
}

.letter.visible p:nth-child(5){
    transition-delay:.60s;
}

.signature{
    text-align:right;

    font-family:
        "DM Serif Display",
        serif;

    font-size:29px;

    font-style:italic;

    color:#ffabc6;

    margin-top:30px;

    animation:
        signatureGlow
        3s ease-in-out
        infinite alternate;
}

@keyframes signatureGlow{
    from{
        text-shadow:
            0 0 3px
            rgba(255,130,170,.1);
    }

    to{
        text-shadow:
            0 0 18px
            rgba(255,130,170,.55);
    }
}


/* =========================================================
   FINAL SURPRISE
========================================================= */

.final-section{
    min-height:100vh;
}

.final-title{
    font-family:
        "DM Serif Display",
        serif;

    font-size:
        clamp(
            43px,
            11vw,
            68px
        );

    margin:
        12px 0;
}

.reveal-box{
    margin-top:35px;

    padding:30px 20px;

    border-radius:25px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.035);

    cursor:pointer;

    transition:.5s;
}

.reveal-box:hover{
    background:
        rgba(255,255,255,.08);

    transform:
        scale(1.02);
}

.reveal-hint{
    font-size:13px;

    opacity:.6;

    animation:
        pulseHint
        2s
        infinite;
}

@keyframes pulseHint{
    50%{
        opacity:1;
    }
}

.secret{
    display:none;

    animation:
        secretReveal
        1.2s
        cubic-bezier(.2,.8,.2,1);
}

.secret.show{
    display:block;
}

@keyframes secretReveal{
    from{
        opacity:0;
        transform:
            translateY(35px)
            scale(.85);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.big-heart{
    font-size:80px;

    display:inline-block;

    animation:
        bigHeart
        1.4s
        infinite;
}

@keyframes bigHeart{
    50%{
        transform:
            scale(1.22);
    }
}

.secret h2{
    font-size:
        clamp(
            40px,
            10vw,
            60px
        );

    margin:
        10px 0;
}

.secret p{
    opacity:.75;

    line-height:1.9;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
    text-align:center;

    padding:
        30px 20px
        80px;

    opacity:.5;

    font-size:11px;

    letter-spacing:.5px;
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.floating-heart{
    position:fixed;

    bottom:-40px;
